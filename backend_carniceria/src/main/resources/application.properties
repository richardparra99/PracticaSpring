spring.application.name=backend_carniceria

spring.jpa.database=POSTGRESQL
spring.datasource.platform=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carniceria_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non.nom_contextual.creation=true
spring.jpa.open-in-view=false

app.jwt.secret=${APP_JWT_SECRET:change-this-development-secret-key-change-this}
app.jwt.expiration-millis=${APP_JWT_EXPIRATION_MILLIS:86400000}

app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:jrpl@ss.com}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:jrpl2026}
app.bootstrap.admin.first-name=${APP_BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
app.bootstrap.admin.last-name=${APP_BOOTSTRAP_ADMIN_LAST_NAME:Principal}
